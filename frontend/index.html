<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 말투 변환기 — BizTalk</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <div class="logo-badge">💼 BizTalk</div>
      <h1>업무 말투 변환기</h1>
      <p class="subtitle">하고 싶은 말을 편하게 적으시면, 상황과 상대에 맞는 프로페셔널한 비즈니스 언어로 다듬어 드립니다.</p>
    </header>

    <!-- 수신 대상 선택 바 -->
    <section class="target-selection-section" aria-label="수신 대상 선택">
      <div class="section-label">수신 대상 선택</div>
      <div class="target-btn-group" role="tablist">
        <button type="button" class="target-btn active" data-target="boss" role="tab" aria-selected="true">
          <span class="icon">👔</span>
          <span class="label">상사 / 임원</span>
          <span class="desc">정중하고 격식 있는 경어체</span>
        </button>
        <button type="button" class="target-btn" data-target="colleague" role="tab" aria-selected="false">
          <span class="icon">🤝</span>
          <span class="label">타팀 동료</span>
          <span class="desc">상호 존중과 협조적 어조</span>
        </button>
        <button type="button" class="target-btn" data-target="client" role="tab" aria-selected="false">
          <span class="icon">🌐</span>
          <span class="label">고객 / 외부</span>
          <span class="desc">신뢰와 감사의 서비스 극존칭</span>
        </button>
        <button type="button" class="target-btn" data-target="team" role="tab" aria-selected="false">
          <span class="icon">👥</span>
          <span class="label">팀 내 동료</span>
          <span class="desc">명확하고 간결한 실무 어조</span>
        </button>
      </div>
    </section>

    <!-- 메인 변환 워크스페이스 (입력/결과 듀얼 패널) -->
    <main class="workspace-grid">
      <!-- 입력 패널 -->
      <section class="panel input-panel">
        <div class="panel-header">
          <label for="inputText" class="panel-title">전달하고 싶은 내용</label>
          <span id="charCount" class="char-count">0자</span>
        </div>
        <div class="textarea-wrapper">
          <textarea 
            id="inputText" 
            placeholder="예시) 내일까지 보고서 제출 어려울 것 같음. 자료 취합이 늦어져서 수요일 오전까지는 가능할 것 같은데 괜찮은지 여쭤봐줘."
            rows="8"
            maxlength="2000"
            autofocus
          ></textarea>
        </div>
        <div class="panel-footer">
          <span class="shortcut-tip">💡 단축키: <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
          <button type="button" id="convertBtn" class="primary-btn">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">말투 변환하기</span>
          </button>
        </div>
      </section>

      <!-- 출력 패널 -->
      <section class="panel output-panel">
        <div class="panel-header">
          <div class="panel-title">
            변환 결과
            <span id="currentPersonaBadge" class="persona-badge">상사 / 임원</span>
          </div>
          <button type="button" id="copyBtn" class="copy-btn" disabled title="결과를 클립보드에 복사">
            <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-text">복사하기</span>
          </button>
        </div>
        <div class="textarea-wrapper output-wrapper">
          <div id="outputPlaceholder" class="output-placeholder">
            <span class="placeholder-icon">✨</span>
            <p>내용을 입력하고 <strong>[말투 변환하기]</strong> 버튼을 누르면<br>비즈니스 매너에 맞춘 완성된 메시지가 여기에 표시됩니다.</p>
          </div>
          <textarea 
            id="outputText" 
            rows="8" 
            readonly 
            style="display: none;"
            aria-label="변환된 결과 내용"
          ></textarea>
        </div>
        <div class="panel-footer output-footer">
          <span id="outputCharCount" class="char-count"></span>
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="app-footer">
      <p>Powered by <strong>Upstage Solar-Pro4</strong> & <strong>FastAPI</strong></p>
    </footer>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="toast" role="status" aria-live="polite">클립보드에 복사되었습니다!</div>

  <script src="/js/app.js"></script>
</body>
</html>
